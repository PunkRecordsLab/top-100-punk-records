<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --mint:#43E8B0; --mint-line:#4FEDB7; --mint-deep:#2FCF9A;
  --mag:#BA3AD8; --mag-line:#C33EE2; --mag-deep:#9B2BB6;
  --plum:#702F7F; --plum-deep:#4B1E55;
  --cream:#FFFEE1; --ink:#111111;
  --disp:'Orbitron','Arial Black',sans-serif;
  --body:'Space Grotesk',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
  --bd:3px solid var(--ink);
  --pop:6px 6px 0 var(--plum-deep);
  --pop-sm:4px 4px 0 var(--plum-deep);
}
*{box-sizing:border-box}
#pr{
  font-family:var(--body); color:var(--ink); min-height:100vh; position:relative;
  background-color:var(--mint);
  background-image:linear-gradient(var(--mint-line) 2px,transparent 2px),linear-gradient(90deg,var(--mint-line) 2px,transparent 2px);
  background-size:44px 44px;
}
#pr ::selection{background:var(--mag);color:var(--cream)}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
.panel{background:var(--cream);border:var(--bd);box-shadow:var(--pop)}

/* ── header ─────────────────────────────── */
.bar{display:flex;align-items:center;gap:14px;padding:18px 0 0}
.bar img{width:62px;height:auto;display:block;filter:drop-shadow(3px 3px 0 rgba(75,30,85,.35))}
.bar .tt{font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.02em;line-height:1.15}
.bar .st{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--plum);text-transform:uppercase}

/* ── hero ───────────────────────────────── */
.hero{margin:22px 0 0;padding:38px 34px;position:relative;overflow:hidden}
.hero .in{position:relative;z-index:1;max-width:640px}
.kick{display:inline-block;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--mag);color:var(--cream);border:2px solid var(--ink);padding:5px 11px;margin-bottom:20px}
.hero h1{font-family:var(--disp);font-weight:900;font-size:clamp(30px,5.6vw,58px);line-height:1.04;margin:0 0 18px;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 span{color:var(--mag);-webkit-text-stroke:2px var(--ink)}
.hero p{font-size:16px;line-height:1.55;margin:0 0 26px;max-width:46ch;color:#2a2030}
.luffy-space{position:absolute;right:20px;bottom:0;width:280px;height:320px;background:rgba(67,232,176,.15);border:3px solid #111;box-shadow:6px 6px 0 rgba(75,30,85,.22);display:flex;align-items:center;justify-content:center;color:#702F7F;font-size:13px;text-align:center;padding:20px;font-family:var(--mono)}
.hero .big{display:none}
@media(max-width:820px){.hero{padding:28px 22px}.hero .big{display:none}}

.btn{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  background:var(--mag);color:var(--cream);border:var(--bd);box-shadow:var(--pop-sm);padding:15px 26px;
  transition:transform .08s ease,box-shadow .08s ease}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--plum-deep)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--plum-deep)}
.btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:var(--pop-sm)}
.btn.ghost{background:var(--cream);color:var(--ink)}
.btn.ghost:hover{background:var(--mint)}

/* ── busca ──────────────────────────────── */
.zig{display:none}
.stick{position:sticky;top:0;z-index:30;background:var(--mint);padding:12px 0;
  background-image:linear-gradient(var(--mint-line) 2px,transparent 2px),linear-gradient(90deg,var(--mint-line) 2px,transparent 2px);
  background-size:44px 44px;border-bottom:var(--bd)}
.fld{position:relative;display:flex;align-items:center}
.fld svg{position:absolute;left:14px;pointer-events:none}
.fld input{width:100%;font-family:var(--body);font-weight:500;font-size:15px;padding:14px 44px 14px 44px;
  background:var(--cream);border:var(--bd);box-shadow:var(--pop-sm);color:var(--ink);outline:none}
.fld input:focus{box-shadow:4px 4px 0 var(--mag)}
.fld input::placeholder{color:#8a7f92}
.wipe{position:absolute;right:9px;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;padding:5px 9px;color:var(--plum)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--cream);border:2px solid var(--ink);padding:7px 12px;cursor:pointer;white-space:nowrap;transition:.12s}
.chip:hover{background:var(--mint-deep)}
.chip[aria-pressed=true]{background:var(--mag);color:var(--cream)}

/* ── grid ───────────────────────────────── */
.tally{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--plum-deep);padding:24px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:16px;padding-bottom:80px}
.card{background:var(--cream);border:var(--bd);box-shadow:var(--pop-sm);padding:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;display:block}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--mag);outline:none}
.card:focus-visible{border-color:var(--mag)}
.pic{aspect-ratio:1;width:100%;position:relative;overflow:hidden;border-bottom:var(--bd);display:block;
  background-color:var(--mint);
  background-image:linear-gradient(var(--mint-line) 2px,transparent 2px),linear-gradient(90deg,var(--mint-line) 2px,transparent 2px);
  background-size:22px 22px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:38px}
.nfo{padding:11px 12px 13px}
.nfo .nm{font-weight:700;font-size:14px;line-height:1.22;margin-bottom:0}

.void{grid-column:1/-1;text-align:center;padding:56px 26px}
.void b{display:block;font-family:var(--disp);font-weight:900;font-size:20px;margin-bottom:10px;text-transform:uppercase}
.void span{font-size:15px;color:#2a2030}

/* ── modal ──────────────────────────────── */
.veil{position:fixed;inset:0;background:rgba(75,30,85,.72);z-index:60;display:grid;place-items:center;padding:18px}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--cream);border:var(--bd);box-shadow:8px 8px 0 var(--plum-deep);position:relative}
.shut{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;background:var(--cream);border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--plum-deep);cursor:pointer;font-size:19px;line-height:1;font-weight:700}
.shut:hover{background:var(--mag);color:var(--cream)}
.face{width:100%;aspect-ratio:16/11;position:relative;overflow:hidden;display:block;
  background-color:var(--mint);
  background-image:linear-gradient(var(--mint-line) 2px,transparent 2px),linear-gradient(90deg,var(--mint-line) 2px,transparent 2px);
  background-size:34px 34px}
.face img{width:100%;height:100%;object-fit:cover;object-position:center 26%;display:block}
.band{background:var(--mag);border-top:var(--bd);padding:16px 22px 12px;position:relative}
.band h2{font-family:var(--disp);font-weight:900;font-size:clamp(19px,4.6vw,27px);line-height:1.08;margin:0;color:var(--cream);text-transform:uppercase}
.band .ja{font-family:var(--mono);font-size:11px;color:rgba(255,254,225,.82);margin-top:6px}
.teeth{display:block;width:100%;height:13px;margin-top:-1px}
.det{padding:18px 22px 22px;max-height:280px;overflow-y:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;max-width:100%}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);
  background:var(--mint);padding:4px 8px;white-space:nowrap}
.tag.k{background:var(--plum);color:var(--cream);border-color:var(--ink)}
.wide{width:100%;text-align:center}

/* ── confirmação ────────────────────────── */
.done{padding:32px 24px 24px;text-align:center}
.stamp{width:168px;height:168px;margin:0 auto 20px;animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-24deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:1}}
.done h3{font-family:var(--disp);font-weight:900;font-size:21px;margin:0 0 12px;text-transform:uppercase}
.done .who{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--mag);-webkit-text-stroke:.6px var(--ink);margin-bottom:6px}
.done .when{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--plum);margin-bottom:24px}
.pair{display:flex;gap:10px}
.pair .btn{flex:1;padding:14px 10px;font-size:12.5px}

/* ── toast ──────────────────────────────── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;background:var(--cream);border:var(--bd);
  box-shadow:var(--pop-sm);padding:13px 17px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:500;max-width:calc(100% - 36px)}
.toast button{background:var(--mag);color:var(--cream);border:2px solid var(--ink);font-family:var(--mono);font-weight:700;
  font-size:11px;text-transform:uppercase;padding:6px 10px;cursor:pointer;white-space:nowrap}

/* ── admin ──────────────────────────────── */
.adm{position:fixed;inset:0;z-index:200;overflow:auto;background-color:var(--plum-deep);
  background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);
  background-size:44px 44px}
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock form{width:min(340px,100%);background:var(--cream);border:var(--bd);box-shadow:var(--pop);padding:26px}
.lock img{width:74px;display:block;margin:0 auto 16px}
.lock label{display:block;font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);margin-bottom:10px;text-align:center}
.lock input{width:100%;font-family:var(--mono);font-size:15px;letter-spacing:.14em;padding:12px;border:2px solid var(--ink);background:#fff;outline:none}
.lock input:focus{border-color:var(--mag)}
.lock .no{font-family:var(--mono);font-size:11px;color:var(--mag-deep);min-height:16px;margin-top:9px;text-align:center}
.ahead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:24px 0 18px}
.ahead h2{font-family:var(--disp);font-weight:900;font-size:22px;margin:0;color:var(--cream);text-transform:uppercase}
.ahead .pair{flex-wrap:wrap}
.ahead .btn{padding:11px 15px;font-size:11.5px;box-shadow:3px 3px 0 var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;padding-bottom:20px}
.kpi{background:var(--cream);border:var(--bd);box-shadow:var(--pop-sm);padding:14px}
.kpi b{display:block;font-family:var(--disp);font-weight:900;font-size:28px;line-height:1;margin-bottom:5px}
.kpi span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--plum)}
.tbl{background:var(--cream);border:var(--bd);box-shadow:var(--pop);margin-bottom:70px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-weight:700;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;text-align:left;
  background:var(--mag);color:var(--cream);padding:11px 12px;border-bottom:var(--bd)}
td{padding:10px 12px;border-bottom:2px solid rgba(17,17,17,.1)}
tr:last-child td{border-bottom:0}
td.p{font-family:var(--disp);font-weight:900;font-size:16px;width:56px}
tr:nth-child(1) td.p,tr:nth-child(2) td.p,tr:nth-child(3) td.p{color:var(--mag)}
td.n{font-weight:700}
td.c{font-family:var(--mono);font-size:11px;color:var(--plum);text-transform:uppercase}
td.v{font-family:var(--mono);font-weight:700;font-size:15px;text-align:right}
.tag-list{background:var(--cream);border:var(--bd);box-shadow:var(--pop);margin-bottom:60px;padding:0;overflow:hidden}
.tag-list h3{font-family:var(--disp);font-weight:700;font-size:16px;background:var(--mag);color:var(--cream);padding:12px 22px;margin:0;text-transform:uppercase}
.tag-items{display:flex;flex-wrap:wrap;gap:8px;padding:18px 22px}
.tag-item{background:var(--mint);border:2px solid var(--ink);padding:6px 11px;font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase}
.note{color:var(--cream);font-family:var(--mono);font-size:13px;padding:26px 0 60px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="pr">
  <div class="wrap">
    <header class="bar">
      <img data-logo alt="Punk Records">
      <div><div class="tt">PUNK RECORDS</div><div class="st">Enquete de popularidade · WT100</div></div>
    </header>

    <section class="hero panel">
      <img class="big" data-logo alt="" aria-hidden="true">
      <div class="in">
        <div class="kick">Enquete aberta</div>
        <h1>Quem é o seu <span>número um?</span></h1>
        <p>Mais de mil personagens passaram por essa história. O laboratório quer saber qual deles ficou com você. Escolha, registre e leve a sua ficha carimbada.</p>
      </div>
    </section>
  </div>


  <div class="stick">
    <div class="wrap">
      <div class="fld">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="Buscar por nome, apelido ou tripulação…" autocomplete="off" aria-label="Buscar personagem">
        <button class="wipe" id="wipe" hidden aria-label="Limpar busca">×</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="tally" id="tally"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

/* ══ UTILS ═══════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
document.querySelectorAll("[data-logo]").forEach(i=>i.src=LOGO);
const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DUO=[["#BA3AD8","#FFFEE1"],["#702F7F","#43E8B0"],["#4B1E55","#FFFEE1"],["#2FCF9A","#4B1E55"],["#FFFEE1","#BA3AD8"]];
function duo(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return DUO[h%DUO.length]}
function ini(n){const p=n.replace(/[.·]/g,"").split(/\s+/).filter(w=>w.length>1);return((p[0]?.[0]||"")+(p[p.length-1]?.[0]||"")).toUpperCase()}
for(const c of CHARS) c._s = norm([c.name,c.ja,c.crew,...c.aliases].join(" "));

function pic(c,cls){
  const [bg,fg]=duo(c.id);
  if(IMG_BASE && c.img) return `<span class="${cls}"><img src="${IMG_BASE}${esc(c.img)}" alt="${esc(c.name)}" loading="lazy"
    onerror="this.remove();this.parentNode.insertAdjacentHTML('beforeend','<span class=\\'mono\\' style=\\'background:${bg};color:${fg}\\'>${ini(c.name)}</span>')"></span>`;
  return `<span class="${cls}"><span class="mono" style="background:${bg};color:${fg}">${ini(c.name)}</span></span>`;
}

/* ══ VOTOS — log append-only, uma chave por voto ═════════ */
async function cast(id){
  const key = `v:${id}:${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  if(!window.storage) throw new Error("storage indisponível — abra o arquivo via link web ou servidor local");
  const r = await window.storage.set(key,"1",true);
  if(!r) throw new Error("gravação recusada");
  return key;
}
async function tallyAll(){
  const res = await window.storage.list("v:",true);
  const keys=(res&&res.keys)||[], counts={}, times=[];
  for(const k of keys){
    const m=/^v:(.+):(\d+)-[a-z0-9]+$/.exec(k); if(!m) continue;
    counts[m[1]]=(counts[m[1]]||0)+1; times.push([m[1],Number(m[2])]);
  }
  return {counts,times};
}

/* ══ LISTA + BUSCA ═══════════════════════════════════════ */
let list=CHARS.slice(), shown=0, crew=null, term="";
const grid=$("#grid");
const crews=[...new Set(CHARS.map(c=>c.crew))].sort((a,b)=>a.localeCompare(b,"pt"));
$("#chips").innerHTML=[`<button class="chip" data-c="" aria-pressed="true">Todos</button>`]
  .concat(crews.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`)).join("");

function apply(){
  const t=norm(term).trim();
  list=CHARS.filter(c=>(!crew||c.crew===crew)&&(!t||c._s.includes(t)));
  grid.innerHTML=""; shown=0;
  $("#tally").textContent=list.length?`${list.length} personagem${list.length>1?"s":""} na cédula`:"";
  if(!list.length){
    grid.innerHTML=`<div class="void panel"><b>Fora dos registros</b><span>Ninguém com esse nome por aqui. Tente o apelido, o nome em japonês ou a tripulação.</span></div>`;
    return;
  }
  more();
}
function more(){
  const s=list.slice(shown,shown+BATCH);
  grid.insertAdjacentHTML("beforeend", s.map(c=>`
    <button class="card" data-id="${c.id}">
      ${pic(c,"pic")}
      <span class="nfo"><span class="nm">${esc(c.name)}</span></span>
    </button>`).join(""));
  shown+=s.length;
}
addEventListener("scroll",()=>{ if(shown<list.length && innerHeight+scrollY>document.body.offsetHeight-700) more(); },{passive:true});

let deb;
$("#q").addEventListener("input",e=>{ term=e.target.value; $("#wipe").hidden=!term; clearTimeout(deb); deb=setTimeout(apply,150); });
$("#wipe").addEventListener("click",()=>{ term=""; $("#q").value=""; $("#wipe").hidden=true; apply(); $("#q").focus(); });
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  crew=b.dataset.c||null;
  [...$("#chips").children].forEach(c=>c.setAttribute("aria-pressed",c===b));
  apply();
});
$("#go").addEventListener("click",()=>{ $("#q").scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(()=>$("#q").focus(),420); });
grid.addEventListener("click",e=>{ const c=e.target.closest(".card"); if(c) openChar(c.dataset.id); });
if(location.protocol==="file:"){
  toast("⚠️ Abrir arquivo local não funciona. Suba em GitHub Pages ou server local para votar.");
  document.querySelectorAll(".card").forEach(x=>x.style.cursor="not-allowed");
}
apply();

/* ══ MODAL ═══════════════════════════════════════════════ */
let veil=null, prev=null;
const TEETH = `<svg class="teeth" viewBox="0 0 100 13" preserveAspectRatio="none" aria-hidden="true">
  <defs><pattern id="tp" width="8" height="13" patternUnits="userSpaceOnUse"><path d="M0 0 L4 13 L8 0 Z" fill="#BA3AD8"/></pattern></defs>
  <rect width="100" height="13" fill="url(#tp)"/></svg>`;
function shut(){ if(veil){veil.remove(); veil=null; prev?.focus();} }
addEventListener("keydown",e=>{ if(e.key==="Escape") shut(); });

function openChar(id){
  const c=CHARS.find(x=>x.id===id); if(!c) return;
  prev=document.activeElement;
  veil=document.createElement("div"); veil.className="veil";
  veil.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
    <button class="shut" aria-label="Fechar">×</button>
    ${pic(c,"face")}
    <div class="band"><h2>${esc(c.name)}</h2><div class="ja">${esc(c.ja)}</div></div>
    <div class="det">
      <div class="tags"><span class="tag k">${esc(c.crew)}</span>${c.aliases.map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div>
      <button class="btn wide vt">Votar em ${esc(c.name.split(" ")[0])}</button>
    </div></div>`;
  veil.addEventListener("click",e=>{ if(e.target===veil||e.target.classList.contains("shut")) shut(); });
  veil.querySelector(".vt").addEventListener("click",ev=>send(ev.currentTarget,c));
  document.getElementById("pr").appendChild(veil);
  veil.querySelector(".vt").focus();
}

async function send(btn,c){
  btn.disabled=true; btn.textContent="Registrando…";
  try{ await cast(c.id); done(c); }
  catch(e){
    btn.disabled=false; btn.textContent=`Votar em ${c.name.split(" ")[0]}`;
    toast("O voto não foi registrado. Verifique a conexão.",()=>send(btn,c));
  }
}

function done(c){
  const when=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
  veil.querySelector(".sheet").innerHTML=`
    <button class="shut" aria-label="Fechar">×</button>
    <div class="done">
      <svg class="stamp" viewBox="0 0 200 200">
        <defs><path id="arc" d="M100 100 m-72 0 a72 72 0 1 1 144 0" fill="none"/></defs>
        <circle cx="100" cy="100" r="88" fill="#BA3AD8" stroke="#111" stroke-width="6"/>

        <text font-family="Space Mono, monospace" font-size="15" font-weight="700" fill="#FFFEE1" letter-spacing="3.4">
          <textPath href="#arc" startOffset="50%" text-anchor="middle">PUNK RECORDS · WT100</textPath></text>
        <text x="100" y="102" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="900" font-size="25" fill="#FFFEE1">VOTO</text>
        <text x="100" y="128" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="900" font-size="19" fill="#FFFEE1">FEITO</text>

/* ══ FICHA COMEMORATIVA (canvas) ═════════════════════════ */
function ficha(c,when){
  const W=1000,H=1250,k=document.createElement("canvas");k.width=W;k.height=H;
  const x=k.getContext("2d"),[bg,fg]=duo(c.id);
  x.fillStyle="#43E8B0";x.fillRect(0,0,W,H);
  x.strokeStyle="#4FEDB7";x.lineWidth=4;
  for(let i=0;i<W;i+=52){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
  for(let i=0;i<H;i+=52){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
  // cartão
  const cx=70,cy=70,cw=W-140,ch=H-140;
  x.fillStyle="#4B1E55";x.fillRect(cx+16,cy+16,cw,ch);
  x.fillStyle="#FFFEE1";x.fillRect(cx,cy,cw,ch);
  x.strokeStyle="#111";x.lineWidth=8;x.strokeRect(cx,cy,cw,ch);
  // retrato
  x.fillStyle=bg;x.fillRect(cx+8,cy+8,cw-16,470);
  x.fillStyle=fg;x.font='900 190px Orbitron, Arial Black, sans-serif';x.textAlign="center";x.textBaseline="middle";
  x.fillText(ini(c.name),W/2,cy+240);
  // dentes
  x.fillStyle="#BA3AD8";
  for(let i=cx+8;i<cx+cw-8;i+=34){x.beginPath();x.moveTo(i,cy+478);x.lineTo(i+17,cy+520);x.lineTo(i+34,cy+478);x.closePath();x.fill();}
  x.fillRect(cx+8,cy+450,cw-16,30);
  x.strokeStyle="#111";x.lineWidth=6;x.beginPath();x.moveTo(cx+8,cy+450);x.lineTo(cx+cw-8,cy+450);x.stroke();
  // nome
  x.fillStyle="#111";let s=76;x.font=`900 ${s}px Orbitron, Arial Black, sans-serif`;
  const nm=c.name.toUpperCase();
  while(x.measureText(nm).width>cw-90&&s>26){s-=4;x.font=`900 ${s}px Orbitron, Arial Black, sans-serif`;}
  x.fillText(nm,W/2,cy+610);
  x.fillStyle="#702F7F";x.font='700 27px Space Mono, monospace';x.fillText(c.crew.toUpperCase(),W/2,cy+668);
  // selo
  x.save();x.translate(W/2,cy+840);x.rotate(-.16);
  x.fillStyle="#BA3AD8";x.beginPath();x.arc(0,0,112,0,7);x.fill();
  x.strokeStyle="#111";x.lineWidth=8;x.stroke();
  x.strokeStyle="#FFFEE1";x.lineWidth=4;x.beginPath();x.arc(0,0,86,0,7);x.stroke();
  x.fillStyle="#FFFEE1";x.font='900 32px Orbitron, sans-serif';x.fillText("VOTO",0,-16);x.fillText("FEITO",0,22);
  x.restore();
  x.fillStyle="#111";x.font='700 26px Space Mono, monospace';x.fillText(when.toUpperCase(),W/2,cy+1010);
  x.fillStyle="#702F7F";x.font='400 21px Space Mono, monospace';x.fillText("PUNK RECORDS · ENQUETE DE POPULARIDADE",W/2,cy+1048);
  const out=()=>{ try{const a=document.createElement("a");a.download=`ficha-${c.id}.png`;a.href=k.toDataURL("image/png");a.click();}
                  catch(e){toast("Não foi possível gerar a ficha.");} };
  const lg=new Image();
  lg.onload=()=>{x.drawImage(lg,cx+cw-186,cy+ch-150,150,143);out();};
  lg.onerror=out; lg.src=LOGO;
}

function toast(msg,retry){
  document.querySelector(".toast")?.remove();
  const t=document.createElement("div");t.className="toast";
  t.innerHTML=`<span>${esc(msg)}</span>`;
  if(retry){const b=document.createElement("button");b.textContent="Tentar de novo";b.onclick=()=>{t.remove();retry();};t.appendChild(b);}
  document.getElementById("pr").appendChild(t);
  setTimeout(()=>t.remove(),retry?9000:5000);
}

/* ══ ADMIN — rota oculta. Ofuscação, não segurança. ══════ */
async function sha(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
let adm=null,data=null;
function route(){
  if(location.hash===ADMIN_ROUTE&&!adm) lock();
  else if(location.hash!==ADMIN_ROUTE&&adm){ adm.remove(); adm=null; }
}
addEventListener("hashchange",route);

function lock(){
  adm=document.createElement("div");adm.className="adm";
  adm.innerHTML=`<div class="lock"><form>
    <img src="${LOGO}" alt="">
    <label>Acesso ao laboratório</label>
    <input type="password" placeholder="senha" autocomplete="off" autofocus>
    <div class="no"></div>
  </form></div>`;
  document.body.appendChild(adm);
  adm.querySelector("form").addEventListener("submit",async e=>{
    e.preventDefault();
    if(await sha(adm.querySelector("input").value)===ADMIN_HASH) panel();
    else{ adm.querySelector(".no").textContent="Senha incorreta."; adm.querySelector("input").select(); }
  });
}

function panel(){
  adm.innerHTML=`<div class="wrap"><div class="ahead"><h2>Apuração</h2>
    <div class="pair">
      <button class="btn ghost" id="re">Recontar</button>
      <button class="btn ghost" id="csv">Exportar .csv</button>
      <button class="btn" id="xls">Exportar .xlsx</button>
    </div></div><div id="ab"><p class="note">Lendo o log de votos…</p></div>
    <div class="tag-list">
      <h3>Tripulações / Tags</h3>
      <div class="tag-items" id="taglist"></div>
    </div>
  </div>`;
  adm.querySelector("#re").onclick=draw;
  adm.querySelector("#csv").onclick=csv;
  adm.querySelector("#xls").onclick=xlsx;
  draw();
  drawTags();
}

function drawTags(){
  const tags=[...new Set(CHARS.map(c=>c.crew))].sort((a,b)=>a.localeCompare(b,"pt"));
  document.getElementById("taglist").innerHTML=tags.map(t=>`<span class="tag-item">${esc(t)}</span>`).join("");
}

async function draw(){
  if(document.getElementById("taglist")) drawTags();
  const b=adm.querySelector("#ab");
  b.innerHTML=`<p class="note">Lendo o log de votos…</p>`;
  try{ data=await tallyAll(); }
  catch(e){ b.innerHTML=`<p class="note">Não foi possível ler o log: ${esc(e.message)}</p>`; return; }
  const rows=rank(), total=data.times.length, hit=Object.keys(data.counts).length;
  const first=total?new Date(Math.min(...data.times.map(t=>t[1]))).toLocaleDateString("pt-BR"):"—";
  b.innerHTML=`<div class="kpis">
      <div class="kpi"><b>${total}</b><span>votos totais</span></div>
      <div class="kpi"><b>${hit}</b><span>personagens votados</span></div>
      <div class="kpi"><b>${CHARS.length}</b><span>na cédula</span></div>
      <div class="kpi"><b>${first}</b><span>primeiro voto</span></div>
    </div>
    ${!total?`<p class="note">Nenhum voto ainda. Vote na tela pública e clique em Recontar.</p>`:
    `<div class="tbl"><table><thead><tr><th>#</th><th>Personagem</th><th>Tripulação</th><th style="text-align:right">Votos</th></tr></thead>
    <tbody>${rows.filter(r=>r[4]>0).map(r=>`<tr><td class="p">${r[0]}</td><td class="n">${esc(r[2])}</td>
      <td class="c">${esc(r[3])}</td><td class="v">${r[4]}</td></tr>`).join("")}</tbody></table></div>`}`;
}

function rank(){
  return CHARS.map(c=>({...c,v:data.counts[c.id]||0}))
    .sort((a,b)=>b.v-a.v||a.name.localeCompare(b.name,"pt"))
    .map((r,i)=>[i+1,r.id,r.name,r.crew,r.v]);
}
function grab(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function csv(){
  if(!data) return;
  const rows=[["Posicao","ID","Personagem","Tripulacao","Votos"],...rank()];
  grab(new Blob(["\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n")],
    {type:"text/csv;charset=utf-8"}),"punk-records-ranking.csv");
}
function xlsx(){
  if(!data) return;
  const go=()=>{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Posição","ID","Personagem","Tripulação","Votos"],...rank()]),"Ranking");
    const nm=Object.fromEntries(CHARS.map(c=>[c.id,c.name]));
    const log=data.times.slice().sort((a,b)=>a[1]-b[1]).map(([id,ts])=>[new Date(ts).toLocaleString("pt-BR"),id,nm[id]||"(desconhecido)"]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Data/hora","ID","Personagem"],...log]),"Votos");
    XLSX.writeFile(wb,"punk-records-apuracao.xlsx");
  };
  if(window.XLSX) return go();
  const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=go; s.onerror=()=>toast("Não foi possível carregar o gerador de Excel. Use o .csv.");
  document.head.appendChild(s);
}

route();
</script>
